# Qwen-direct pipeline configuration — VLM-only segmentation (no 3D pose).
#
# Companion to ../../Kinematics_pipeline/pipeline/config.yaml. Both
# pipelines share the same dataset, the same closed action taxonomy, hand
# vocabulary, and sentence style templates (imported from Kinematics_pipeline
# — see common.py) so their outputs are directly comparable. What differs is
# how segment BOUNDARIES are found: Kinematics_pipeline computes them from
# 3D hand-pose signals; this pipeline asks Qwen3-VL to find them directly
# from dense video windows (see level1_transitions/).
#
# NOTHING in this pipeline has been run yet — thresholds below are ported
# from ref_code/segment_transitions.py or copied from Kinematics_pipeline
# for a fair starting comparison, and should be revisited after the first
# real run + verifier pass, exactly like every level in Kinematics_pipeline
# was tuned.

paths:
  # old /mnt/3466ADC766AD8A66/... mount no longer exists on this machine;
  # repointed 2026-07-15 to match the sibling pipelines' config.yaml.
  data_dir: /data/egocentric_data/ego_dex_data/ego_dex_data_Extracted/part1/part1
  output_dir: /data/egocentric_data/ego_data_subtask_pipeline/VLM_seg_subtask_pipeline/outputs
  model_path: /data/huggingface_cache/hub/models--Qwen--Qwen3-VL-32B-Instruct/snapshots/0cfaf48183f594c314753d30a4c4974bc75f3ccb

# language-annotation resolution — same facts established by Level 0 audit
# in Kinematics_pipeline (see Kinematics_pipeline/experiments/01_*.md).
# Duplicated here (not imported) so this pipeline's config is self-contained.
hdf5:
  task_attr: task
  description_attr: llm_description
  description2_attr: llm_description2
  which_description_attr: which_llm_description
  fallback_description_attr: description

video:
  fps_fallback: 30.0     # only used if a video's fps can't be probed

model:
  attn_implementation: sdpa   # sdpa | flash_attention_2 | eager (transformers backend only)
  dtype: bfloat16

# ---- vLLM-server backend (default) ----
# Added 2026-07-15, mirroring VLM_subtask_pipeline's identical upgrade: both
# levels originally loaded Qwen3-VL-32B in-process via transformers and
# called generate() sequentially, no batching — much slower than talking to
# a vLLM server, and (for Level 2) meant no guided-JSON decoding, so the
# closed vocabulary was only enforced post-hoc with retries instead of being
# impossible to violate. Points at the SAME vLLM server the sibling
# pipelines use — only one Qwen3-VL-32B should be resident on the GPU at a
# time. Server must be launched with `--limit-mm-per-prompt
# '{"image": N}'` where N >= max(level1_transitions.keyframes_per_window,
# level2_labeling.keyframes_per_segment), and a large enough
# `--max-model-len` to hold them.
vlm:
  backend: vllm_endpoint    # vllm_endpoint | transformers
  endpoint_url: http://localhost:8000/v1
  api_key: EMPTY
  model_name: Qwen3-VL-32B-Instruct
  concurrency: 4            # parallel EPISODES in flight; within one episode,
                            # Level 1 windows and Level 2 segments both stay
                            # sequential (segments are labeled in order so
                            # each prompt carries the story so far)

# ---- Level 1: VLM transition-frame detection (no kinematics at all) ----
# Ported from ref_code/segment_transitions.py. The video is walked in
# non-overlapping windows. transformers backend: EVERY frame in a window is
# shown to the model as true video input, so no candidate transition instant
# is skipped. vllm_endpoint backend: window_frames still defines the window's
# source span (unchanged), but only keyframes_per_window evenly-spaced
# frames within it are actually rendered to images and sent (decoupled the
# same way VLM_subtask_pipeline decouples model_frames from
# vlm.keyframes_per_window) — a real tradeoff (sparser sampling than native
# dense video) made for the proven, already-validated keyframe-image
# pattern instead of vLLM's untested video_url path in this environment.
level1_transitions:
  window_frames: 48        # frames per window == stride (no overlap)
  keyframes_per_window: 12 # vllm_endpoint only: evenly-spaced frames of the
                            # window actually sent as images
  keyframe_size: 512       # px, long side (vllm_endpoint only)
  max_new_tokens: 512
  temperature: 0.2
  repetition_penalty: 1.3  # transformers backend only
  max_retries: 3
  retry_backoff_sec: 3.0
  min_segment_frames: 30   # degenerate-check floor (1s @ 30fps) — matches
                            # Kinematics_pipeline for a fair first comparison

# ---- Level 2: per-segment semantic labeling ----
# Action taxonomy, hand vocabulary, and the 6 sentence style templates are
# IMPORTED from Kinematics_pipeline (see common.py), not redefined — so
# both pipelines' outputs use identical vocabulary. Structural difference
# from Kinematics_pipeline: there is no pose signal to compute the hand
# from, so the VLM is asked for it directly (now with explicit criteria —
# see task_configs/ — after the same "everything defaults to both hands"
# failure mode was found and fixed in VLM_subtask_pipeline). vllm_endpoint
# backend adds real guided-JSON decoding (the closed vocabulary becomes
# IMPOSSIBLE to violate, not just retried on violation).
level2_labeling:
  keyframes_per_segment: 5
  keyframe_size: 768
  style_variation: true
  temperature: 0.0
  max_new_tokens: 300
  max_retries: 3
  debug_first_n: 10

# ---- Level 3: validation & assembly ----
# Same merge/idle/schema shape as Kinematics_pipeline. Cross-check flags
# differ: there is no independent kinematic signal to check a verb against,
# so `kinematic_mismatch` does not exist here. `low_confidence` (VLM
# self-report) and `short_segment` (computed in code) take its place.
assembly:
  merge_gap_s: 0.5
  idle_gap_s: 1.0
  short_segment_frac: 0.34   # flag a merged segment under this fraction of
                              # its episode's median segment duration
  pipeline_version: "0.1.0-direct"
